<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="FONTDIR/@fontsource/black-han-sans/index.css">
<link rel="stylesheet" href="FONTDIR/@fontsource/noto-sans-kr/700.css">
<link rel="stylesheet" href="FONTDIR/@fontsource/noto-sans-kr/900.css">
<style>
:root{--y:#FFD84D;--k:#141414;--w:#fff;--r:#D7263D;--b:#4A90D9;--g:#9AA1A9}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--k)}
.bh{font-family:"Black Han Sans",sans-serif;font-weight:400}
.nt{font-family:"Noto Sans KR",sans-serif;font-weight:900}
.sc{position:absolute;inset:0;opacity:0;overflow:hidden}
#cap{position:absolute;left:0;right:0;bottom:70px;text-align:center;z-index:50;font-family:"Noto Sans KR";font-weight:900}
#cap span{display:inline-block;font-size:48px;line-height:1.3;color:#fff;background:rgba(20,20,20,.85);padding:8px 26px;border-radius:14px;max-width:1760px;white-space:nowrap}
#cap b{color:var(--y)}
#logo{position:absolute;right:46px;top:36px;width:120px;height:120px;border-radius:50%;background:var(--y);border:6px solid var(--k);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60}
#logo .q{font-size:54px;line-height:.85} #logo .g{font-size:26px}
.card3{display:flex;gap:40px;justify-content:center}
.qc{width:520px;height:300px;border-radius:30px;background:#fff;border:8px solid var(--k);box-shadow:0 14px 0 var(--k);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.qc .n{width:100px;height:100px;border-radius:50%;background:var(--k);color:var(--y);font-size:64px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.qc .t{font-size:56px;color:var(--k);text-align:center;padding:0 10px}
.stamp{position:absolute;color:var(--r);border:10px solid var(--r);border-radius:18px;padding:6px 26px;background:rgba(255,255,255,.88);font-family:"Black Han Sans"}
.ev{position:absolute;left:160px;right:160px;top:150px;background:#fff;border-radius:26px;border:8px solid var(--k);padding:46px 60px}
.ev .h{font-family:"Black Han Sans";font-size:58px;color:var(--k)}
.ev .s{font-family:"Noto Sans KR";font-weight:700;font-size:28px;color:#666;margin:6px 0 24px}
.ev .q{font-family:'Noto Sans KR';font-weight:700;font-size:54px;line-height:1.45;color:#222}
.ev mark{background:transparent;transition:none}
.ev .ko{font-family:"Noto Sans KR";font-weight:900;font-size:42px;color:var(--k);border-left:12px solid var(--y);padding-left:20px;margin-top:26px}
.ev .nn{position:absolute;right:28px;bottom:16px;font-family:"Noto Sans KR";font-weight:700;font-size:22px;color:#999}
.tag{display:inline-block;font-family:"Black Han Sans";font-size:60px;background:var(--y);color:var(--k);border:7px solid var(--k);border-radius:18px;padding:6px 28px}
svg{position:absolute;left:0;top:0}
</style></head><body>
<div id="stage"></div>
<div id="cap"></div>
<div id="logo"><div class="q bh">?</div><div class="g bh">괜히</div></div>
<script>
const TL=__TIMELINE__;
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>1-Math.pow(1-cl(x),3);
const pop=(t,t0,d=.3)=>{if(t<t0)return 0;const x=(t-t0)/d;return x>=1?1:ease(x)*1.08-0.08*x};
const K='#141414',Y='#FFD84D',R='#D7263D',B='#4A90D9',G='#9AA1A9',SK='#F2C9A0';
// ---- illustrations (1920x1080 svg strings) ----
const person=(x,y,s,body,head='')=>`<g transform="translate(${x},${y}) scale(${s})">${body}<circle cx="0" cy="-200" r="70" fill="${SK}" stroke="${K}" stroke-width="10"/>${head}<circle cx="-24" cy="-205" r="7" fill="${K}"/><circle cx="24" cy="-205" r="7" fill="${K}"/></g>`;
const parka=`<path d="M-120,-130 Q0,-170 120,-130 L140,180 L-140,180 Z" fill="${Y}" stroke="${K}" stroke-width="10"/><rect x="-110" y="180" width="95" height="200" rx="20" fill="${Y}" stroke="${K}" stroke-width="10"/><rect x="15" y="180" width="95" height="200" rx="20" fill="${Y}" stroke="${K}" stroke-width="10"/><path d="M-80,-150 Q0,-120 80,-150" fill="none" stroke="${K}" stroke-width="10"/>`;
const arrows=(n,r)=>{let s='';for(let i=0;i<n;i++){const a=(-150+i*(120/(n-1)))*Math.PI/180;const x1=Math.cos(a)*r,y1=Math.sin(a)*r-200,x2=Math.cos(a)*(r+90),y2=Math.sin(a)*(r+90)-200;s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${R}" stroke-width="14" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="12" fill="${R}"/>`}return `<g class="arr">${s}</g>`};
const ILLO={
 door:()=>`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="#fff"/><rect x="760" y="200" width="420" height="700" rx="14" fill="${Y}" stroke="${K}" stroke-width="12"/><circle cx="1120" cy="560" r="20" fill="${K}"/><rect x="640" y="900" width="660" height="30" fill="${K}"/><g class="bub"><path d="M1230,240 h520 a40 40 0 0 1 40 40 v170 a40 40 0 0 1 -40 40 h-380 l-80 60 l10 -60 h-70 a40 40 0 0 1 -40 -40 v-170 a40 40 0 0 1 40 -40z" fill="#fff" stroke="${K}" stroke-width="10"/><text x="1490" y="395" text-anchor="middle" font-family="Black Han Sans" font-size="78" fill="${K}">모자 써!</text></g></svg>`,
 cold:()=>`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="#E9F3FB"/>${[...Array(26)].map((_,i)=>`<text x="${(i*271)%1900}" y="${(i*173)%1000+60}" font-size="${40+(i%3)*20}" fill="${B}" opacity=".5" class="snow">❄</text>`).join('')}<rect x="880" y="180" width="90" height="560" rx="45" fill="#fff" stroke="${K}" stroke-width="12"/><circle cx="925" cy="780" r="90" fill="${B}" stroke="${K}" stroke-width="12"/><rect x="905" y="520" width="40" height="230" fill="${B}"/><text x="1080" y="420" font-family="Black Han Sans" font-size="90" fill="${K}">미군 추위 실험</text><text x="1080" y="520" font-family="Noto Sans KR" font-weight="900" font-size="48" fill="#555">어디로 열이 빠져나갈까?</text></svg>`,
 magnify:()=>`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="${Y}"/><g class="mag"><circle cx="900" cy="480" r="220" fill="#fff" stroke="${K}" stroke-width="22"/><line x1="1060" y1="640" x2="1300" y2="880" stroke="${K}" stroke-width="46" stroke-linecap="round"/><text x="900" y="560" text-anchor="middle" font-family="Black Han Sans" font-size="240" fill="${K}">?</text></g><text x="1300" y="380" font-family="Black Han Sans" font-size="80" fill="${K}">뭘 입고</text><text x="1300" y="480" font-family="Black Han Sans" font-size="80" fill="${K}">있었을까?</text></svg>`,
 arctic:()=>`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="#E9F3FB"/>${person(960,560,1.15,parka,`<path d="M-75,-215 a75 75 0 0 1 150 0" fill="none"/>`)}<g transform="translate(960,560) scale(1.15)">${arrows(5,80)}</g><text x="1350" y="330" font-family="Black Han Sans" font-size="72" fill="${K}">드러난 곳은</text><text x="1350" y="430" font-family="Black Han Sans" font-size="96" fill="${R}">머리뿐</text><text x="160" y="330" font-family="Black Han Sans" font-size="64" fill="${K}">북극용</text><text x="160" y="420" font-family="Black Han Sans" font-size="64" fill="${K}">생존 방한복</text></svg>`,
 pants:()=>`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="#fff"/>${person(560,560,1,`<path d="M-120,-130 Q0,-170 120,-130 L140,180 L-140,180 Z" fill="${B}" stroke="${K}" stroke-width="10"/><rect x="-110" y="180" width="95" height="200" rx="20" fill="#555" stroke="${K}" stroke-width="10"/><rect x="15" y="180" width="95" height="200" rx="20" fill="#555" stroke="${K}" stroke-width="10"/>`)}${person(1360,560,1,`<path d="M-120,-130 Q0,-170 120,-130 L140,180 L-140,180 Z" fill="${B}" stroke="${K}" stroke-width="10"/><rect x="-110" y="180" width="95" height="200" rx="20" fill="${SK}" stroke="${K}" stroke-width="10"/><rect x="15" y="180" width="95" height="200" rx="20" fill="${SK}" stroke="${K}" stroke-width="10"/><rect x="-140" y="150" width="280" height="70" rx="16" fill="#fff" stroke="${K}" stroke-width="10"/>`,`<path d="M-80,-240 q80,-90 160,0" fill="${R}" stroke="${K}" stroke-width="10"/>`)}<text x="560" y="150" text-anchor="middle" font-family="Black Han Sans" font-size="70" fill="${K}">모자 없이</text><text x="1360" y="150" text-anchor="middle" font-family="Black Han Sans" font-size="70" fill="${K}">바지 없이</text><g class="eq"><text x="960" y="520" text-anchor="middle" font-family="Black Han Sans" font-size="200" fill="${R}">=</text><text x="960" y="640" text-anchor="middle" font-family="Black Han Sans" font-size="64" fill="${R}">똑같이 추워야?</text></g></svg>`,
 scale:()=>`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="${Y}"/><g class="beam"><line x1="560" y1="420" x2="1360" y2="420" stroke="${K}" stroke-width="22" stroke-linecap="round"/><path d="M460,420 l100,200 h-200z" transform="translate(100,0)" fill="#fff" stroke="${K}" stroke-width="12"/><path d="M1260,420 l100,200 h-200z" transform="translate(100,0)" fill="#fff" stroke="${K}" stroke-width="12"/><text x="560" y="700" text-anchor="middle" font-family="Black Han Sans" font-size="72" fill="${K}">머리</text><text x="1360" y="700" text-anchor="middle" font-family="Black Han Sans" font-size="72" fill="${K}">몸</text></g><path d="M960,420 l-90,520 h180z" fill="${K}"/><text x="960" y="200" text-anchor="middle" font-family="Black Han Sans" font-size="90" fill="${K}">같은 조건에서 다시 재면?</text></svg>`,
 tank:()=>`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="#fff"/><rect x="560" y="300" width="800" height="620" rx="20" fill="#CFE6FA" stroke="${K}" stroke-width="12"/><rect x="560" y="420" width="800" height="500" fill="${B}" opacity=".55"/><g class="swimmer"><circle cx="960" cy="380" r="62" fill="${SK}" stroke="${K}" stroke-width="10"/><circle cx="940" cy="375" r="7" fill="${K}"/><circle cx="980" cy="375" r="7" fill="${K}"/><rect x="890" y="440" width="140" height="300" rx="50" fill="${SK}" stroke="${K}" stroke-width="10" opacity=".9"/></g><text x="960" y="200" text-anchor="middle" font-family="Black Han Sans" font-size="84" fill="${K}">2006년 찬물 실험</text><text class="lab1" x="1420" y="400" font-family="Black Han Sans" font-size="56" fill="${K}">머리: 물 밖</text><text class="lab2" x="1420" y="400" font-family="Black Han Sans" font-size="56" fill="${R}">머리: 물속</text></svg>`,
 area:()=>`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="#fff"/><g transform="translate(620,560)"><circle cx="0" cy="-330" r="80" fill="${Y}" stroke="${K}" stroke-width="10"/><rect x="-130" y="-240" width="260" height="360" rx="50" fill="#E3E6EA" stroke="${K}" stroke-width="10"/><rect x="-120" y="120" width="100" height="330" rx="40" fill="#E3E6EA" stroke="${K}" stroke-width="10"/><rect x="20" y="120" width="100" height="330" rx="40" fill="#E3E6EA" stroke="${K}" stroke-width="10"/><rect x="-220" y="-230" width="80" height="300" rx="36" fill="#E3E6EA" stroke="${K}" stroke-width="10"/><rect x="140" y="-230" width="80" height="300" rx="36" fill="#E3E6EA" stroke="${K}" stroke-width="10"/></g><text x="1000" y="380" font-family="Black Han Sans" font-size="70" fill="${K}">머리 = 몸 표면적의</text><text x="1000" y="560" font-family="Black Han Sans" font-size="200" fill="${K}">약 7%</text><g class="plus"><rect x="1000" y="640" width="760" height="150" rx="24" fill="${Y}" stroke="${K}" stroke-width="10"/><text x="1380" y="740" text-anchor="middle" font-family="Black Han Sans" font-size="66" fill="${K}">머리를 담가도 열 손실 +10%쯤</text></g></svg>`,
 coat:()=>`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="#E9F3FB"/>${person(760,560,1.1,`<path d="M-130,-130 Q0,-170 130,-130 L160,330 L-160,330 Z" fill="#555" stroke="${K}" stroke-width="10"/><line x1="0" y1="-140" x2="0" y2="330" stroke="${K}" stroke-width="8"/>`)}<g transform="translate(760,560) scale(1.1)">${arrows(5,80)}</g><text x="1150" y="420" font-family="Black Han Sans" font-size="74" fill="${K}">코트 입고 머리만 내놓으면</text><text x="1150" y="540" font-family="Black Han Sans" font-size="96" fill="${R}">머리가 큰 구멍</text></svg>`,
 babyTease:()=>`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="${K}"/><g transform="translate(960,560)"><ellipse cx="0" cy="120" rx="200" ry="160" fill="#555"/><circle cx="0" cy="-90" r="150" fill="#555"/></g><text x="960" y="500" text-anchor="middle" font-family="Black Han Sans" font-size="260" fill="${Y}">?</text><text x="960" y="160" text-anchor="middle" font-family="Black Han Sans" font-size="72" fill="#fff">정말로 맞는 사람</text></svg>`,
 baby:()=>`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="#FFF6DD"/><g transform="translate(960,600)"><ellipse cx="0" cy="170" rx="300" ry="220" fill="#fff" stroke="${K}" stroke-width="12"/><circle cx="0" cy="-110" r="190" fill="${SK}" stroke="${K}" stroke-width="12"/><path d="M-190,-140 a190 190 0 0 1 380 0 q-190 -60 -380 0z" fill="${B}" stroke="${K}" stroke-width="12"/><circle cx="0" cy="-330" r="34" fill="${B}" stroke="${K}" stroke-width="10"/><path d="M-70,-70 q20,18 40,0 M30,-70 q20,18 40,0" stroke="${K}" stroke-width="10" fill="none"/><path d="M-30,10 q30,22 60,0" stroke="${K}" stroke-width="10" fill="none"/></g><text x="960" y="140" text-anchor="middle" font-family="Black Han Sans" font-size="80" fill="${K}">신생아 모자</text></svg>`,
 proportion:()=>`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="#fff"/><g transform="translate(560,600)"><circle cx="0" cy="-160" r="120" fill="${Y}" stroke="${K}" stroke-width="10"/><ellipse cx="0" cy="120" rx="150" ry="170" fill="#E3E6EA" stroke="${K}" stroke-width="10"/></g><g transform="translate(1260,560)"><circle cx="0" cy="-330" r="70" fill="${Y}" stroke="${K}" stroke-width="10"/><rect x="-110" y="-250" width="220" height="330" rx="50" fill="#E3E6EA" stroke="${K}" stroke-width="10"/><rect x="-100" y="80" width="85" height="330" rx="38" fill="#E3E6EA" stroke="${K}" stroke-width="10"/><rect x="15" y="80" width="85" height="330" rx="38" fill="#E3E6EA" stroke="${K}" stroke-width="10"/></g><text x="560" y="150" text-anchor="middle" font-family="Black Han Sans" font-size="64" fill="${K}">아기: 머리가 큼</text><text x="1260" y="150" text-anchor="middle" font-family="Black Han Sans" font-size="64" fill="${K}">어른</text><g class="x3"><rect x="760" y="140" width="400" height="160" rx="26" fill="${R}"/><text x="960" y="245" text-anchor="middle" font-family="Black Han Sans" font-size="58" fill="#fff">피부 면적 ×3</text></g></svg>`,
 noeffect:()=>`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="#fff"/><g transform="translate(560,600) scale(.8)"><ellipse cx="0" cy="170" rx="300" ry="220" fill="#fff" stroke="${K}" stroke-width="12"/><rect x="-300" y="120" width="600" height="90" fill="${B}" stroke="${K}" stroke-width="10"/><circle cx="0" cy="-110" r="190" fill="${SK}" stroke="${K}" stroke-width="12"/></g><g transform="translate(1360,600) scale(.8)"><ellipse cx="0" cy="170" rx="300" ry="220" fill="#fff" stroke="${K}" stroke-width="12"/><circle cx="0" cy="-110" r="190" fill="${SK}" stroke="${K}" stroke-width="12"/><path d="M-190,-140 a190 190 0 0 1 380 0" fill="none" stroke="#bbb" stroke-width="30" stroke-dasharray="20 14"/></g><text x="560" y="250" text-anchor="middle" font-family="Black Han Sans" font-size="60" fill="${K}">배에 띠</text><text x="1360" y="250" text-anchor="middle" font-family="Black Han Sans" font-size="60" fill="${K}">얇은 붕대 모자</text><g class="x1"><text x="560" y="560" text-anchor="middle" font-family="Black Han Sans" font-size="420" fill="${R}" opacity=".85">✕</text></g><g class="x2"><text x="1360" y="560" text-anchor="middle" font-family="Black Han Sans" font-size="420" fill="${R}" opacity=".85">✕</text></g><text x="960" y="130" text-anchor="middle" font-family="Black Han Sans" font-size="76" fill="${K}">효과 없음</text></svg>`,
};
// ---- scene builders ----
const st=document.getElementById('stage');
const S=TL.scenes.map((s,i)=>({...s,t1:(TL.scenes[i+1]||{t:TL.end}).t}));
// chapter cards are scenes too
S.forEach(s=>{let el;
 if(s.type==='photo'){el=$(`<div class="sc"><div class="ph" style="position:absolute;inset:-40px;background:url(${s.src}) ${s.pos}/cover"></div><div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,20,20,.75),rgba(20,20,20,.1) 60%)"></div>${s.bubble?`<div class="bub bh" style="position:absolute;left:140px;top:300px;font-size:150px;color:${Y};-webkit-text-stroke:6px ${K}">${s.bubble.text}</div>`:''}${s.tags?`<div style="position:absolute;left:140px;top:260px;display:flex;flex-direction:column;gap:30px">${s.tags.map(t=>`<span class="tag tg">${t}</span>`).join('')}</div>`:''}</div>`)}
 else if(s.type==='evidence'){el=$(`<div class="sc" style="background:${K}"><div class="ev"><div class="h">${s.head}</div><div class="s">${s.src}</div><div class="q">${s.quote.join('<br>')}</div><div class="ko">${s.ko}</div><div class="nn">${s.note}</div></div></div>`)}
 else if(s.type==='big'){el=$(`<div class="sc" style="background:${Y}"><div class="bh" style="position:absolute;left:0;right:0;top:${s.small?330:250}px;text-align:center;font-size:${s.small?200:300}px;color:${K}">${s.text}</div>${s.small?`<div class="nt" style="position:absolute;left:0;right:0;top:220px;text-align:center;font-size:60px;color:#555">${s.small}</div>`:''}${s.stamp?`<div class="stamp st" style="left:1180px;top:520px;font-size:120px">${s.stamp.text}</div>`:''}</div>`)}
 else if(s.type==='loops'){el=$(`<div class="sc" style="background:${K}"><div class="bh" style="position:absolute;left:0;right:0;top:150px;text-align:center;font-size:80px;color:#fff">끝까지 보면 풀리는 질문 3개</div><div class="card3" style="position:absolute;left:0;right:0;top:380px">${s.items.map((it,j)=>`<div class="qc li"><div class="n bh">${j+1}</div><div class="t bh" style="font-size:46px">${it.text}</div></div>`).join('')}</div></div>`)}
 else if(s.type==='quiz'){el=$(`<div class="sc" style="background:${Y}"><div class="bh" style="position:absolute;left:0;right:0;top:120px;text-align:center;font-size:96px;color:${K}">${s.q}</div><div class="card3" style="position:absolute;left:0;right:0;top:360px">${s.opts.map((o,j)=>`<div class="qc op"><div class="n bh">${j+1}</div><div class="t bh">${o}</div></div>`).join('')}</div><div class="cd bh" style="position:absolute;left:0;right:0;top:760px;text-align:center;font-size:110px;color:${K}"></div><div class="stamp hold" style="left:760px;top:740px;font-size:72px">잠시 후 공개!</div><div class="stamp ans" style="left:1330px;top:320px;font-size:80px;transform:rotate(-10deg)">정답</div></div>`)}
 else if(s.type==='card'){el=$(`<div class="sc" style="background:${K}"><div class="bh" style="position:absolute;left:0;right:0;top:330px;text-align:center;font-size:180px;color:${Y}">${s.n}</div><div class="bh" style="position:absolute;left:0;right:0;top:560px;text-align:center;font-size:110px;color:#fff">${s.title}</div></div>`)}
 else if(s.type==='illo'){el=$(`<div class="sc">${ILLO[s.id]()}</div>`)}
 else if(s.type==='recap'){el=$(`<div class="sc" style="background:#fff"><div class="bh" style="position:absolute;left:0;right:0;top:110px;text-align:center;font-size:96px;color:${K}">세 번 뒤집기 정리</div>${s.items.map((it,j)=>`<div class="ri" style="position:absolute;left:260px;right:260px;top:${290+j*200}px;height:160px;border-radius:26px;background:${Y};border:8px solid ${K};display:flex;align-items:center;padding-left:40px"><span class="bh" style="font-size:80px;margin-right:36px">${j+1}</span><span class="bh" style="font-size:60px">${it.text}</span></div>`).join('')}</div>`)}
 else if(s.type==='twohats'){el=$(`<div class="sc" style="background:${Y}"><div style="position:absolute;left:230px;top:110px;width:640px;height:640px;border-radius:30px;border:8px solid ${K};background:url(knit_hat.jpg) 50% 22%/cover"></div><div style="position:absolute;left:1050px;top:110px;width:640px;height:640px;border-radius:30px;border:8px solid ${K};overflow:hidden">${ILLO.baby().replace('width="1920" height="1080"','width="640" height="640" viewBox="560 160 800 800"')}</div><span class="tag" style="position:absolute;left:300px;top:780px;background:#fff">어른: 많아야 10%</span><span class="tag" style="position:absolute;left:1170px;top:780px;background:#fff">아기: 꼭 필요</span></div>`)}
